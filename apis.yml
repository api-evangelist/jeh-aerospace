name: Jeh Aerospace
description: >-
  Jeh Aerospace is a precision aerospace manufacturing company building "future
  factories" across the US-India corridor to supply aerostructures and
  aero-engine components for the commercial aerospace supply chain. From
  certified facilities in India spanning more than 160,000 square feet, Jeh
  delivers machining, sheet metal, tubes and pipes, surface treatment,
  structural assembly, and engineering services on time and at scale. The
  company is fully compliant with AS9100, ISO 9001, OEM requirements, and export
  regulations, and weaves a digital thread across its supplier networks for
  radical transparency. Jeh operates from both the US and India and is backed by
  General Catalyst and IndiGo Ventures.
